services:
    postgres:
        image: postgres:18-bookworm
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: +-*3622
            POSTGRES_DB: tasks
        restart: always
        volumes:
            - pg_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d tasks']
            interval: 5s
            timeout: 5s
            retries: 5

    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '8080:8080'
        environment:
            - PORT=8080
            - DATABASE_URL=postgres://postgres:+-*3622@postgres:5432/tasks?sslmode=disable
        depends_on:
            migration:
                condition: service_completed_successfully
    migration:
        image: migrate/migrate:v4.19.1
        volumes:
            - ./migrations:/migrations
        command:
            - -path=/migrations
            - -database=postgres://postgres:+-*3622@postgres:5432/tasks?sslmode=disable
            - up
        depends_on:
            postgres:
                condition: service_healthy
volumes:
    pg_data:
